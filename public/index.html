<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Produtos</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos customizados (animacoes e toasts) -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

  <!-- ========== TOAST CONTAINER ========== -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- ========== HEADER ========== -->
  <header class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center gap-3">
      <div class="w-9 h-9 bg-brand-500 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900 leading-tight">Gerenciador de Produtos</h1>
        <p class="text-xs text-gray-500">CRUD conectado com a API REST local</p>
      </div>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="max-w-5xl mx-auto px-6 py-8 space-y-8">

    <!-- FORMULARIO -->
    <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <h2 id="formTitle" class="text-base font-semibold text-gray-700 mb-5">
        Cadastrar Novo Produto
      </h2>

      <form id="produtoForm" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <!-- Campo oculto para o ID em modo edicao -->
        <input type="hidden" id="produtoId" />

        <!-- Nome -->
        <div class="sm:col-span-3 md:col-span-1">
          <label for="nome" class="block text-xs font-medium text-gray-500 mb-1 uppercase tracking-wide">Nome</label>
          <input
            id="nome"
            type="text"
            placeholder="Ex: Notebook Dell"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
          />
        </div>

        <!-- Preco -->
        <div>
          <label for="preco" class="block text-xs font-medium text-gray-500 mb-1 uppercase tracking-wide">Preco (R$)</label>
          <input
            id="preco"
            type="number"
            step="0.01"
            min="0.01"
            placeholder="Ex: 2999.90"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
          />
        </div>

        <!-- Quantidade -->
        <div>
          <label for="quantidade" class="block text-xs font-medium text-gray-500 mb-1 uppercase tracking-wide">Quantidade</label>
          <input
            id="quantidade"
            type="number"
            step="1"
            min="1"
            placeholder="Ex: 50"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
          />
        </div>

        <!-- Botoes -->
        <div class="sm:col-span-3 flex items-center gap-3 pt-1">
          <button
            id="submitBtn"
            type="submit"
            class="inline-flex items-center gap-2 bg-brand-500 hover:bg-brand-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            <span id="submitBtnText">Cadastrar Produto</span>
          </button>

          <button
            id="cancelBtn"
            type="button"
            class="hidden text-sm text-gray-500 hover:text-gray-700 px-4 py-2.5 rounded-lg border border-gray-300 hover:border-gray-400 transition"
          >
            Cancelar
          </button>
        </div>
      </form>
    </section>

    <!-- LISTA DE PRODUTOS -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-semibold text-gray-700">Produtos Cadastrados</h2>
        <span id="totalBadge" class="text-xs bg-brand-100 text-brand-700 font-semibold px-3 py-1 rounded-full">0 produtos</span>
      </div>

      <!-- Estado vazio -->
      <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center bg-white rounded-2xl border border-dashed border-gray-300">
        <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10" />
        </svg>
        <p class="text-sm font-medium text-gray-400">Nenhum produto cadastrado</p>
        <p class="text-xs text-gray-400 mt-1">Use o formulario acima para adicionar o primeiro.</p>
      </div>

      <!-- Tabela de produtos -->
      <div id="tableWrapper" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200 text-left">
                <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Nome</th>
                <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Preco</th>
                <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Quantidade</th>
                <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Acoes</th>
              </tr>
            </thead>
            <tbody id="produtosTableBody" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
